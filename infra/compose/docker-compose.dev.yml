# Hạ tầng cho môi trường dev. Web chạy trên máy bằng `pnpm dev`.
# Chạy: pnpm infra:up      Dừng: pnpm infra:down
# Chạy worker trong Docker (đủ LibreOffice, poppler):  docker compose -f infra/compose/docker-compose.dev.yml --profile worker up -d
# Chạy toàn bộ bằng Docker (web + worker + migration): docker compose -f infra/compose/docker-compose.dev.yml --profile app up -d --build
name: khotl

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: khotl
      POSTGRES_PASSWORD: khotl
      POSTGRES_DB: khotl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khotl -d khotl"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Lưu file theo chuẩn S3. MinIO bản cộng đồng đã ngừng phát hành từ 10/2025
  # nên dùng SeaweedFS; bucket và CORS do ứng dụng tự tạo khi khởi động.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3"]
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Lần đầu khởi động mất 1–3 phút để tải cơ sở dữ liệu virus.
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

  # Chạy migration và seed một lần rồi thoát
  migrate:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://khotl:khotl@postgres:5432/khotl
      S3_ENDPOINT: http://s3:8333
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://khotl:khotl@postgres:5432/khotl
      S3_ENDPOINT: http://s3:8333
      SMTP_URL: smtp://mailpit:1025
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["worker", "app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://khotl:khotl@postgres:5432/khotl
      S3_ENDPOINT: http://s3:8333
      CLAMAV_HOST: clamav
      SMTP_URL: smtp://mailpit:1025
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  pgdata: {}
  s3data: {}
