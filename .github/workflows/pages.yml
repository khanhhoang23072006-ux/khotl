name: Bản demo trên GitHub Pages

# Đăng demo/index.html kèm sw.js, manifest và icons (PWA). Trang là một file HTML, dữ liệu mẫu nhúng sẵn, chạy hoàn toàn trên trình duyệt).
# Sửa giao diện demo ở demo/template.html rồi chạy: pnpm demo:build
on:
  push:
    branches: [main]
    paths: ["demo/**", "index.html", "sw.js", "manifest.webmanifest", "icons/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Chuẩn bị thư mục
        run: mkdir -p site && cp demo/index.html site/index.html && cp -r sw.js manifest.webmanifest icons site/ && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
