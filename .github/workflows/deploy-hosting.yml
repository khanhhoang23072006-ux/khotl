name: Đăng lên hosting (hustdocu.id.vn)

# Thay cho deploy.bat: mỗi lần push lên main (hoặc bấm Run workflow), tải các file web và API PHP lên hosting qua FTP,
# rồi kiểm tra API OTP có chạy qua HTTPS không.
# Cần đặt ở Settings → Secrets and variables → Actions: FTP_HOST, FTP_USER, FTP_PASS
# (tuỳ chọn, ở tab Variables: FTP_DIR, mặc định /domains/hustdocu.id.vn/public_html).
# Trong lúc chuyển tên miền, cũng tải lên thư mục cũ lofcreate.online để tên miền cũ vẫn chạy (lỗi ở đây chỉ cảnh báo).
# api/config.php (token GitHub, mã quản trị) KHÔNG upload từ đây, sửa trực tiếp trên hosting.
on:
  push:
    branches: [main]
    paths: [".htaccess", "index.html", "sw.js", "manifest.webmanifest", "api/**", "data/**", "icons/**", ".github/workflows/deploy-hosting.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Hosting treo thì dừng sau 10 phút, không giữ hàng chờ nhiều giờ
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Chẩn đoán tên miền (DNS)
        run: |
          for d in hustdocu.id.vn www.hustdocu.id.vn lofcreate.online; do
            echo "::notice::$d → A: $(dig +short A $d | tr '\n' ' ') | NS: $(dig +short NS ${d#www.} | tr '\n' ' ')"
          done
          [ -n "${{ secrets.FTP_HOST }}" ] && echo "::notice::FTP_HOST → $(dig +short A '${{ secrets.FTP_HOST }}' | tr '\n' ' ' || true)"
          true

      - name: Tải file lên hosting qua FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/domains/hustdocu.id.vn/public_html' }}
          OLD_DIR: /domains/lofcreate.online/public_html
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Thiếu secret FTP_HOST, FTP_USER hoặc FTP_PASS (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          files=".htaccess index.html sw.js manifest.webmanifest
            api/_security.php api/_mailer.php api/send_otp.php api/verify_otp.php api/voice_signal.php api/extensions.php
            api/data/.htaccess api/data/otps/.htaccess
            data/hust-feed.json icons/icon.svg icons/icon-192.png icons/icon-512.png icons/og.png"
          # Chọn cách kết nối: FTP mã hoá (FTPS) có kiểm tra chứng chỉ. Hosting dùng chung thường cấp chứng chỉ
          # đứng tên máy chủ của nhà cung cấp, không phải IP: đọc tên đó từ chứng chỉ rồi kết nối bằng tên này.
          # Chỉ khi máy chủ không có FTPS hợp lệ mới gửi FTP thường (như deploy.bat).
          host="$FTP_HOST"; tls="--ssl-reqd"; resolve=()
          probe() { curl -sS --ssl-reqd --connect-timeout 20 --max-time 60 --user "$FTP_USER:$FTP_PASS" "${resolve[@]}" --list-only "ftp://$host/" -o /dev/null 2>/tmp/ftp-err; }
          if ! probe; then
            cn=$(echo | timeout 20 openssl s_client -connect "$FTP_HOST:21" -starttls ftp 2>/dev/null \
                  | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
                  | grep -oE '(DNS:|CN ?= ?)[A-Za-z0-9*.-]+' | head -1 | sed -E 's/^(DNS:|CN ?= ?)//; s/^\*\./ftp./')
            if [ -n "$cn" ]; then
              host="$cn"; resolve=(--resolve "$cn:21:$FTP_HOST")
              echo "Chứng chỉ FTP đứng tên $cn: kết nối bằng tên này"
            fi
            if ! probe; then
              echo "::warning::Hosting không có FTP mã hoá hợp lệ ($(head -c 200 /tmp/ftp-err)). Gửi bằng FTP thường như deploy.bat."
              host="$FTP_HOST"; tls=""; resolve=()
              if ! curl -sS --connect-timeout 20 --max-time 60 --user "$FTP_USER:$FTP_PASS" --list-only "ftp://$host/" -o /dev/null 2>/tmp/ftp-err; then
                echo "::error::Không kết nối được FTP của hosting ($(head -c 200 /tmp/ftp-err)). Kiểm tra hosting còn hoạt động và secret FTP_HOST (nên là IP máy chủ hosting)."
                exit 1
              fi
            fi
          fi
          fail=0
          dirs="$FTP_DIR"; [ "$OLD_DIR" != "$FTP_DIR" ] && dirs="$dirs $OLD_DIR"
          for dir in $dirs; do
            [ "$dir" = "$FTP_DIR" ] && main=1 || main=0
            for f in $files; do
              [ -f "$f" ] || { echo "Bỏ qua $f (không có)"; continue; }
              if curl -sS --fail $tls "${resolve[@]}" --ftp-create-dirs --retry 2 --connect-timeout 20 --max-time 120 \
                   --user "$FTP_USER:$FTP_PASS" -T "$f" "ftp://$host$dir/$f"; then
                echo "Đã tải $dir/$f"
              elif [ $main = 1 ]; then
                echo "::error::Không tải được $dir/$f"
                fail=1
              else
                echo "::warning::Không tải được $dir/$f (thư mục tên miền cũ)"
              fi
            done
          done
          exit $fail

      - name: Kiểm tra API OTP trên hosting
        if: always()
        run: |
          check() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 15 -X POST -H 'Content-Type: application/json' -d '{}' "$1" || true)
            echo "::notice::$1 → HTTP $code: $(head -c 150 /tmp/body | tr -d '\r\n')"
            # 400 = API chạy và từ chối email rỗng (đúng mong đợi)
            [ "$code" = "400" ]
          }
          ok=0
          for d in hustdocu.id.vn lofcreate.online; do
            # Chẩn đoán: trang tĩnh và API có cùng lỗi không (502 ở cả trang tĩnh = máy chủ hosting lỗi, không phải code PHP)
            for u in http://$d/ https://$d/ http://$d/api/extensions.php?action=list; do
              echo "::notice::$u → HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$u" || true)"
            done
            if check https://$d/api/send_otp.php; then
              echo "::notice::$d: API chạy qua HTTPS."; ok=1
            elif check http://$d/api/send_otp.php; then
              echo "::warning::$d: API chỉ chạy qua HTTP. Bật SSL (Let's Encrypt) cho $d trong trang quản lý hosting."
            else
              echo "::warning::$d: không gọi được API (tên miền chưa trỏ về hosting hoặc chưa thêm vào hosting)."
            fi
          done
          [ $ok = 1 ] || { echo "::error::Không tên miền nào gọi được API qua HTTPS."; exit 1; }
