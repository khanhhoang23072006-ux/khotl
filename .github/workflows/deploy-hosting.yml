name: Đăng lên hosting (hustdocu.id.vn)

on:
  push:
    branches: [main]
    paths:
      - ".htaccess"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "api/**"
      - "data/**"
      - "icons/**"
      - ".github/workflows/deploy-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Tải file lên hosting qua FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || 'free02.123host.vn' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/domains/hustdocu.id.vn/public_html' }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Thiếu secret FTP_USER hoặc FTP_PASS (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          files=".htaccess index.html sw.js manifest.webmanifest
            api/_security.php api/_mailer.php api/send_otp.php api/verify_otp.php api/voice_signal.php api/extensions.php
            api/data/.htaccess api/data/otps/.htaccess
            data/hust-feed.json icons/icon.svg icons/icon-192.png icons/icon-512.png icons/og.png"
          
          for f in $files; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              curl -sS --ftp-pasv --ftp-create-dirs --retry 2 --max-time 30 \
                --user "$FTP_USER:$FTP_PASS" \
                -T "$f" "ftp://$FTP_HOST$FTP_DIR/$f"
            fi
          done
          echo "Đã đồng bộ thành công toàn bộ file lên http://hustdocu.id.vn!"

      - name: Kiểm tra API OTP trên hosting
        run: |
          check() {
            code=$(curl -k -L -s -o /tmp/body -w '%{http_code}' --max-time 15 -X POST -H 'Content-Type: application/json' -d '{}' "$1" || true)
            echo "::notice::$1 → HTTP $code: $(head -c 150 /tmp/body | tr -d '\r\n')"
            [ "$code" = "400" ]
          }
          if check http://hustdocu.id.vn/api/send_otp.php || check https://hustdocu.id.vn/api/send_otp.php; then
            echo "::notice::API send_otp trên hustdocu.id.vn hoạt động chuẩn xác!"
          else
            echo "::error::API send_otp không phản hồi HTTP 400."
            exit 1
          fi
