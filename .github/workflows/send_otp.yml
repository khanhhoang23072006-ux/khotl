name: Send OTP Email
on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient Email'
        required: true
      otp:
        description: 'OTP Code'
        required: true

# Không cần quyền gì trên repo
permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Mail via Gmail SMTP
        uses: actions/github-script@v7
        env:
          # Email gửi OTP và mật khẩu ứng dụng Gmail: đặt ở Settings → Secrets and variables → Actions,
          # không ghi thẳng vào file (repo công khai, ai cũng đọc được).
          SMTP_USER: ${{ secrets.OTP_SMTP_USER }}
          SMTP_PASS: ${{ secrets.OTP_SMTP_PASS }}
          SMTP_FROM_NAME: ${{ vars.OTP_FROM_NAME || 'HUSTDOCU' }}
        with:
          script: |
            const tls = require('tls');
            const to = context.payload.inputs.to;
            const otp = context.payload.inputs.otp;
            // Che mã OTP và địa chỉ nhận trong log (log Actions của repo công khai ai cũng xem được)
            core.setSecret(otp);
            core.setSecret(to);
            // Chặn chèn lệnh SMTP: chỉ nhận một địa chỉ email hợp lệ và mã 6 chữ số
            if (!/^[^\s@<>\r\n,;]+@[^\s@<>\r\n,;]+\.[^\s@<>\r\n,;]+$/.test(to) || to.length > 120 || !/^\d{6}$/.test(otp)) {
              core.setFailed('Tham số không hợp lệ.');
              return;
            }
            const user = process.env.SMTP_USER;
            const pass = (process.env.SMTP_PASS || '').replace(/\s+/g, '');
            const fromName = process.env.SMTP_FROM_NAME || 'HUSTDOCU';
            if (!user || !pass) {
              core.setFailed('Thiếu secret OTP_SMTP_USER hoặc OTP_SMTP_PASS (Settings → Secrets and variables → Actions).');
              return;
            }

            const enc = (t) => (/[^\x20-\x7E]/.test(t) ? `=?UTF-8?B?${Buffer.from(t).toString('base64')}?=` : t);
            const b64 = (t) => Buffer.from(t).toString('base64').replace(/.{76}/g, '$&\r\n');
            const subject = `Mã xác thực HUSTDOCU: ${otp}`;
            const text = `Mã xác thực đăng nhập HUSTDOCU của bạn là: ${otp}\r\n\r\nMã có hiệu lực trong 10 phút. Nếu bạn không yêu cầu mã này, hãy bỏ qua email.`;
            const html = `<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;border:2px solid #111;padding:24px;background:#fff"><h2 style="margin:0 0 16px;color:#D7263D">HUSTDOCU</h2><p>Mã xác thực đăng nhập của bạn là:</p><div style="font-size:32px;font-weight:bold;letter-spacing:6px;color:#111;padding:16px 0;text-align:center;background:#f4f4f4;border:1px dashed #999;margin:16px 0">${otp}</div><p style="font-size:13px;color:#555">Mã có hiệu lực trong 10 phút. Nếu bạn không yêu cầu mã này, hãy bỏ qua email.</p></div>`;
            const boundary = 'b' + require('crypto').randomBytes(12).toString('hex');
            const message = [
              `Date: ${new Date().toUTCString().replace('GMT', '+0000')}`,
              `Message-ID: <${require('crypto').randomBytes(16).toString('hex')}@${user.split('@')[1]}>`,
              `From: ${enc(fromName)} <${user}>`,
              `To: <${to}>`,
              `Subject: ${enc(subject)}`,
              'MIME-Version: 1.0',
              `Content-Type: multipart/alternative; boundary="${boundary}"`,
              '',
              `--${boundary}`,
              'Content-Type: text/plain; charset=UTF-8',
              'Content-Transfer-Encoding: base64',
              '',
              b64(text),
              `--${boundary}`,
              'Content-Type: text/html; charset=UTF-8',
              'Content-Transfer-Encoding: base64',
              '',
              b64(html),
              `--${boundary}--`,
            ].join('\r\n');

            // Hội thoại SMTP: mỗi lệnh chờ đúng mã phản hồi, sai mã thì dừng ngay và báo lý do
            const steps = [
              [null, 220, 'chào'],
              ['EHLO github-actions', 250, 'EHLO'],
              ['AUTH LOGIN', 334, 'AUTH'],
              [Buffer.from(user).toString('base64'), 334, 'tài khoản'],
              [Buffer.from(pass).toString('base64'), 235, 'mật khẩu ứng dụng Gmail (sai hoặc đã bị thu hồi?)'],
              [`MAIL FROM:<${user}>`, 250, 'MAIL FROM'],
              [`RCPT TO:<${to}>`, 250, 'RCPT TO'],
              ['DATA', 354, 'DATA'],
              [message + '\r\n.', 250, 'gửi thư'],
            ];

            await new Promise((resolve, reject) => {
              const client = tls.connect({ port: 465, host: 'smtp.gmail.com', servername: 'smtp.gmail.com' });
              const timer = setTimeout(() => { client.destroy(); reject(new Error('Hết thời gian chờ Gmail SMTP')); }, 20000);
              let buf = '';
              let i = 0;
              client.on('data', (d) => {
                if (i >= steps.length) return; // phản hồi của QUIT sau khi đã xong
                buf += d.toString();
                // Chờ đủ dòng cuối của phản hồi ("250 ..." chứ không phải "250-...")
                const lines = buf.split('\r\n').filter(Boolean);
                const last = lines[lines.length - 1] || '';
                if (!buf.endsWith('\r\n') || last[3] === '-') return;
                const code = parseInt(last.slice(0, 3), 10);
                const [, expect, what] = steps[i];
                buf = '';
                if (code !== expect) {
                  i = steps.length;
                  clearTimeout(timer);
                  client.end('QUIT\r\n');
                  reject(new Error(`SMTP ${what}: ${last}`));
                  return;
                }
                i += 1;
                if (i === steps.length) {
                  clearTimeout(timer);
                  client.end('QUIT\r\n');
                  resolve();
                  return;
                }
                client.write(steps[i][0] + '\r\n');
              });
              client.on('error', (e) => { clearTimeout(timer); reject(e); });
            });
            console.log('Đã gửi thư mã OTP.');
